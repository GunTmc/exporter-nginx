name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Bun menjalankan .ts tanpa memeriksa tipe, jadi tsc dijalankan terpisah (lewat Bun juga: tidak ada Node di pipeline ini)
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  test:
    name: Uji (Bun ${{ matrix.bun }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # versi "latest" memberi peringatan dini bila rilis Bun berikutnya mengubah perilaku; tidak menggagalkan CI
    continue-on-error: ${{ matrix.bun == 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        bun: [1.4.0, latest]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun test ./test/ # pakai "./": tanpa itu Bun mencocokkan path yang memuat "test/" di mana pun

  deploy-script:
    name: Script deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: bash -n deploy/nginxlogreport-daily.sh
      - run: shellcheck deploy/nginxlogreport-daily.sh
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Jalankan script harian pada log contoh
        run: |
          bun test/make-sample-log.ts --out=examples/sample.log
          mkdir -p "$RUNNER_TEMP/logs"
          cp examples/sample.log "$RUNNER_TEMP/logs/access-2026-09-23.log"
          LOG_DIR="$RUNNER_TEMP/logs" REPORT_DIR="$RUNNER_TEMP/reports" REPORT_DATE=2026-09-23 STATUS=0 \
            deploy/nginxlogreport-daily.sh
          test -s "$RUNNER_TEMP/reports/access-2026-09-23.html"
          test "$(stat -c %a "$RUNNER_TEMP/reports/access-2026-09-23.html")" = 600
