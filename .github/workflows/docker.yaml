name: Docker

# Pull request dan push ke main: bangun image dan uji. Tag v*: bangun multi-arsitektur lalu dorong ke GHCR.
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - src/**
      - test/**
      - deploy/**
      - .github/workflows/docker.yaml

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Bangun image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # hanya dipakai saat tag v*
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun test/make-sample-log.ts --out=examples/sample.log

      # nama image = pemilik/nama-repo, jadi package di GHCR otomatis sama dengan repo (GHCR mewajibkan huruf kecil)
      - name: Nama image
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      # satu arsitektur, dimuat ke docker lokal untuk diuji
      - name: Bangun (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: nginxlogreport:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Uji image
        run: |
          docker run --rm nginxlogreport:ci --version
          # jalankan seperti pengguna: bukan root, log dibaca-saja
          mkdir -p "$RUNNER_TEMP/out"
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/examples:/logs:ro" -v "$RUNNER_TEMP/out:/out" \
            nginxlogreport:ci /logs/sample.log --mask --out=/out/r.html --json=/out/r.json --quiet
          jq -e '.groups | length == 7' "$RUNNER_TEMP/out/r.json"
          test "$(stat -c %a "$RUNNER_TEMP/out/r.html")" = 600
          # kode keluar salah pakai harus sampai ke pemanggil
          set +e; docker run --rm nginxlogreport:ci --bogus 2>/dev/null; code=$?; set -e
          test "$code" = 2

      - name: Uji di dalam image (docker build --target test)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          cache-from: type=gha

      - uses: docker/setup-qemu-action@v4
        if: startsWith(github.ref, 'refs/tags/v')

      - uses: docker/login-action@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag dan label image
        id: meta
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Dorong ke GHCR (amd64 + arm64)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
